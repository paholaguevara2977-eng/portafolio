<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <title>Buscador de Filtros - Portafolio Emmanuel</title>
    <link rel="stylesheet" href="proyectos.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a href="index.html" class="back-btn">← Volver al portafolio</a>
            <span>Buscador de Filtros</span>
        </div>

        <div class="card">
            <h2><span>🔍</span> Buscador de Filtros</h2>

            <p style="color:#aaa; margin-bottom:5px;">Escribe para filtrar en tiempo real por <strong>nombre</strong> o <strong>categoría</strong> (no distingue mayúsculas ni tildes).</p>

            <input type="text" id="buscador" placeholder="Ej.: uva, cafe, granos, post..." oninput="filtrar();" autocomplete="off">

            <div class="output" id="resumen">Mostrando 12 de 12 productos.</div>

            <div id="lista" style="margin-top:15px;"></div>

            <button class="btn" onclick="limpiar()">Limpiar filtro</button>
        </div>

        <div class="footer-note">Portafolio Emmanuel - Proyecto 4</div>
    </div>

    <script>
        var productos = [
            { nombre: 'Manzana', categoria: 'Frutas' },
            { nombre: 'Pera', categoria: 'Frutas' },
            { nombre: 'Uva', categoria: 'Frutas' },
            { nombre: 'Café', categoria: 'Bebidas' },
            { nombre: 'Té', categoria: 'Bebidas' },
            { nombre: 'Jugo', categoria: 'Bebidas' },
            { nombre: 'Pastel', categoria: 'Postres' },
            { nombre: 'Galleta', categoria: 'Postres' },
            { nombre: 'Pudín', categoria: 'Postres' },
            { nombre: 'Arroz', categoria: 'Granos' },
            { nombre: 'Frijol', categoria: 'Granos' },
            { nombre: 'Maíz', categoria: 'Granos' }
        ];

        function normalizar(texto) {
            var limpio = texto.toLowerCase();
            if (limpio.normalize) {
                limpio = limpio.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            }
            return limpio;
        }

        function filtrar() {
            var termino = normalizar(document.getElementById('buscador').value.replace(/^\s+|\s+$/g, ''));
            var lista = document.getElementById('lista');
            var encontrados = 0;
            lista.innerHTML = '';

            for (var i = 0; i < productos.length; i++) {
                var producto = productos[i];
                var coincide = termino === '' ||
                    normalizar(producto.nombre).indexOf(termino) !== -1 ||
                    normalizar(producto.categoria).indexOf(termino) !== -1;

                if (coincide) {
                    encontrados = encontrados + 1;
                    lista.appendChild(crearItem(producto));
                }
            }

            var resumen = document.getElementById('resumen');
            if (termino === '') {
                resumen.innerHTML = 'Mostrando ' + encontrados + ' de ' + productos.length + ' productos.';
            } else if (encontrados === 0) {
                resumen.innerHTML = 'Sin resultados para <strong>' + termino + '</strong>. Prueba con otra palabra.';
            } else {
                resumen.innerHTML = 'Encontrados <strong>' + encontrados + '</strong> de ' + productos.length + ' productos para "' + termino + '".';
            }
        }

        function crearItem(producto) {
            var item = document.createElement('div');
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            item.style.gap = '10px';
            item.style.padding = '12px 15px';
            item.style.marginBottom = '8px';
            item.style.background = 'rgba(255,255,255,0.05)';
            item.style.border = '1px solid rgba(255,255,255,0.1)';
            item.style.borderRadius = '10px';

            var nombre = document.createElement('span');
            nombre.style.fontSize = '1.05rem';
            nombre.innerHTML = producto.nombre;

            var categoria = document.createElement('span');
            categoria.style.fontSize = '0.8rem';
            categoria.style.padding = '5px 12px';
            categoria.style.borderRadius = '50px';
            categoria.style.whiteSpace = 'nowrap';
            categoria.style.background = 'rgba(123,47,247,0.25)';
            categoria.style.border = '1px solid rgba(123,47,247,0.6)';
            categoria.innerHTML = producto.categoria;

            item.appendChild(nombre);
            item.appendChild(categoria);
            return item;
        }

        function limpiar() {
            document.getElementById('buscador').value = '';
            filtrar();
            document.getElementById('buscador').focus();
        }

        filtrar();
    </script>
</body>
</html>
